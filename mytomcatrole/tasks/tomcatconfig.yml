---
- name: copy tomuser.j2 file into node side
  template:
     src:  templates/tomuser.j2
     dest: /opt/tomcat/apache-tomcat-10.1.60/conf/tomcat-users.xml

- name: copy tomcat context file into node side
  template:
     src:  templates/tomcontext.j2
     dest: /opt/tomcat/apache-tomcat-10.1.60/webapps/manager/META-INF/context.xml


- name: copy tomcat host context file into node side
  template:
     src:  templates/tomhostcontext.j2
     dest: /opt/tomcat/apache-tomcat-10.1.60/webapps/host-manager/META-INF/context.xml